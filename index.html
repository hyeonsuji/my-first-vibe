<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5144">
<title>탐구노트 | 과학 탐구 기록장</title>
<style>
:root{
  color-scheme:light;
  --bg:#faf7ef;--grid:rgba(15,81,68,.07);--card:#fff;--text:#16302a;--muted:#5d6e68;--line:#e5e1d4;
  --primary:#0f5144;--primary-2:#16705e;--primary-weak:#e3efe9;--on-primary:#fff;
  --ok:#1f7a45;--ok-weak:#e1f3e8;--warn:#a2620a;--warn-weak:#fbf0da;
  --bad:#c23b3b;--bad-weak:#fbe7e5;--info:#5a48b8;--info-weak:#eeebfb;
  --radius:16px;--shadow:0 1px 2px rgba(15,81,68,.06),0 4px 14px rgba(15,81,68,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Batang,"바탕",BatangChe,AppleMyungjo,"Noto Serif KR","Noto Serif CJK KR","Nanum Myeongjo",serif;
  background-color:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;word-break:keep-all;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;background-attachment:fixed}
body.lock{overflow:hidden}
a{color:var(--primary)}
h1,h2,h3{margin:0;line-height:1.3}
h1{font-size:22px}h2{font-size:17px}h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)}.sm{font-size:13px}
.pre{white-space:pre-wrap;word-break:break-word}

/* layout */
.shell{display:flex;min-height:100vh}
.sidebar{display:none}
.main{flex:1;min-width:0;padding:0 16px calc(88px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;padding-top:calc(12px + env(safe-area-inset-top))}
.brand{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;min-width:0}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--primary)}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.logo{width:30px;height:30px;border-radius:9px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:15px;flex:none}
.who{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.who b{color:var(--text);white-space:nowrap}
.content{max-width:1080px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;font-size:10.5px;letter-spacing:-.02em;white-space:nowrap;color:var(--muted);text-decoration:none;position:relative}
.tabbar a .ic{display:flex}
.sidebar nav a .ic{display:flex}
.tabbar a.on{color:var(--primary);font-weight:700}
.dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
@media (min-width:768px){
  .sidebar{display:flex;flex-direction:column;gap:4px;width:232px;flex:none;position:sticky;top:0;height:100vh;padding:20px 14px;background:var(--card);border-right:1px solid var(--line)}
  .sidebar .brand{padding:0 8px 16px}
  .sidebar nav{display:flex;flex-direction:column;gap:2px}
  .sidebar nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--text);position:relative}
  .sidebar nav a:hover{background:var(--bg)}
  .sidebar nav a.on{background:var(--primary-weak);color:var(--primary);font-weight:700}
  .sidebar nav a .dot{position:static;margin-left:auto}
  .sidebar .me{margin-top:auto;padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .tabbar,.topbar{display:none}
  .main{padding:28px 32px 48px}
}

/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card+.card,.stack>*+*{margin-top:14px}
.grid>.card{margin-top:0}
.card h2{margin-bottom:12px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 16px}
.page-head p{margin-top:4px;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font:inherit;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.danger{color:var(--bad);border-color:var(--bad-weak)}
.btn.ok{color:var(--ok);border-color:var(--ok-weak)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn.link{border:none;background:none;color:var(--muted);padding:0 6px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-size:13px;font-weight:700;color:var(--muted)}
.field>span em{color:var(--bad);font-style:normal}
.field .help{font-size:12px;color:var(--muted);margin-top:-2px}
.field>span .hint{margin-left:6px;font-size:12px;font-weight:600;color:var(--primary)}
.input,select.input,textarea.input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:16px}
textarea.input{min-height:96px;resize:vertical;line-height:1.55}
.input:focus{outline:2px solid var(--primary);outline-offset:-1px;background:var(--card)}
.row{display:grid;gap:0 12px;grid-template-columns:1fr}
@media (min-width:560px){.row.c2{grid-template-columns:1fr 1fr}.row.c3{grid-template-columns:2fr 1fr 1fr}}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:768px){.grid.c2{grid-template-columns:1fr 1fr}}
@media (min-width:1000px){.grid.c3{grid-template-columns:repeat(3,1fr)}}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--bg);color:var(--muted)}
.badge.ok{background:var(--ok-weak);color:var(--ok)}.badge.warn{background:var(--warn-weak);color:var(--warn)}
.badge.bad{background:var(--bad-weak);color:var(--bad)}.badge.info{background:var(--info-weak);color:var(--info)}
.badge.pri{background:var(--primary-weak);color:var(--primary)}
.chip{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button.chip{font:inherit;font-size:13px;color:var(--text);cursor:pointer;height:36px}
button.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:700}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin-bottom:14px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1000px){.tiles{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.tile-k{font-size:13px;color:var(--muted);font-weight:600}
.tile-v{font-size:28px;font-weight:800;line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums}
.tile-s{font-size:12px;color:var(--warn);font-weight:600}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;color:inherit;text-decoration:none;box-shadow:var(--shadow)}
a.item:hover{border-color:var(--primary)}
.item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.item-title{font-size:15px;font-weight:700;word-break:break-word}
.item-meta{font-size:13px;color:var(--muted);margin-top:4px}
.item-snip{font-size:14px;margin-top:6px;color:var(--text);opacity:.85;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .btns{margin-top:10px}
.note{margin-top:8px;padding:8px 10px;border-radius:9px;background:var(--bg);font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filters .input{flex:1 1 180px;width:auto}
.filters select.input{flex:0 1 180px}
.empty{text-align:center;padding:36px 16px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:var(--radius)}
.empty .big{font-size:34px;margin-bottom:6px}
.notice{padding:12px 14px;border-radius:12px;background:var(--warn-weak);color:var(--warn);font-size:14px;margin-bottom:14px}
.notice.info{background:var(--primary-weak);color:var(--primary)}
.sec{padding:14px 0;border-top:1px solid var(--line)}
.sec h3{font-size:13px;color:var(--muted);margin-bottom:6px}
.feedback{margin-top:14px;padding:14px;border-radius:12px;background:var(--info-weak)}
.feedback h3{color:var(--info);margin-bottom:6px}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
td .input{min-height:38px;padding:6px 10px;font-size:14px}
.gcard-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.gcard.idle{border-color:var(--bad)}
.members{display:flex;flex-wrap:wrap;gap:6px;min-height:28px}
.gstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.gstats a{display:flex;flex-direction:column;align-items:center;padding:8px 4px;border-radius:10px;background:var(--bg);text-decoration:none;color:var(--text)}
.gstats a:hover{background:var(--primary-weak)}
.gstats b{font-size:20px;font-variant-numeric:tabular-nums}
.gstats span{font-size:12px;color:var(--muted)}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.feed li:first-child{border-top:none;padding-top:0}
.feed a{color:var(--text);text-decoration:none;font-weight:600}
.feed .when{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:18px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bar i{display:block;width:100%;max-width:34px;background:var(--primary);border-radius:6px 6px 2px 2px;min-height:2px}
.bar b{font-size:12px;font-variant-numeric:tabular-nums}
.bar span{font-size:11px;color:var(--muted);white-space:nowrap}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;font-size:14px}
.checks input{width:18px;height:18px;accent-color:var(--primary)}
.req-row{display:flex;gap:12px;align-items:flex-start}
.req-row>input[type=checkbox]{width:20px;height:20px;margin-top:3px;accent-color:var(--primary);flex:none}
.req-row>div{flex:1;min-width:0}
.review{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.review .input{flex:1 1 200px;width:auto;min-height:38px;font-size:14px;padding:6px 10px}
.batchbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;margin-bottom:12px;border-radius:12px;background:var(--primary-weak)}

textarea.input.short{min-height:64px}

/* landing */
.land-head{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top));background:rgba(250,247,239,.88);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.land-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--primary);min-width:0;white-space:nowrap}
.land-brand b{font-size:18px;font-weight:900;letter-spacing:-.02em}
.land-brand .bar{color:var(--line)}
.land-brand small{font-size:14px;font-weight:600;color:var(--muted)}
.land-head .btns{flex-wrap:nowrap}
.btn.ghost{background:transparent}
@media (max-width:480px){.land-brand .bar,.land-brand small,.hide-xs{display:none}.land-head{padding-left:16px;padding-right:16px}}
.hero{max-width:1040px;margin:0 auto;padding:56px 20px 24px}
.eyebrow{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid #bcd6cc;background:var(--card);
  color:var(--primary);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.hero h1{font-size:clamp(32px,6.4vw,56px);font-weight:900;color:var(--primary);letter-spacing:-.03em;line-height:1.18;margin:18px 0 16px}
.hero .lead{font-size:clamp(15px,2.2vw,18px);color:var(--muted);max-width:640px;line-height:1.7}
.club-tag{margin-top:14px;font-size:14px;color:var(--muted)}
.club-tag b{color:var(--primary)}
.starts{display:grid;gap:16px;grid-template-columns:1fr;margin-top:34px}
@media (min-width:640px){.starts{grid-template-columns:1fr 1fr}}
.start{display:flex;align-items:center;gap:16px;width:100%;padding:22px;border-radius:22px;border:1px solid var(--line);background:var(--card);
  color:var(--text);font:inherit;text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.start:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(15,81,68,.14)}
.start .ico{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;flex:none;background:var(--primary-weak);color:var(--primary)}
.start strong{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em}
.start .d{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.start .go{margin-left:auto;display:flex;opacity:.6;flex:none}
.start.dark{background:var(--primary);border-color:var(--primary);color:#fff}
.start.dark .ico{background:rgba(255,255,255,.14);color:#fff}
.start.dark .d{color:rgba(255,255,255,.78)}
.features{display:grid;gap:14px;grid-template-columns:1fr;margin-top:40px}
@media (min-width:760px){.features{grid-template-columns:repeat(3,1fr)}}
.feature{display:block;width:100%;padding:20px;border-radius:22px;border:1.5px solid var(--line);background:rgba(255,255,255,.82);
  color:var(--text);font:inherit;text-align:left;cursor:pointer;transition:border-color .15s}
.feature:hover{border-color:var(--primary)}
.feature .ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--primary-weak);color:var(--primary)}
.feature h3{font-size:17px;font-weight:800;color:var(--primary);margin:14px 0 4px}
.feature p{font-size:14px;color:var(--muted)}
.land-foot{text-align:center;color:var(--muted);font-size:13px;padding:28px 20px calc(32px + env(safe-area-inset-bottom))}

/* modal */
.modal-back{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,32,26,.45);animation:fade .15s}
.modal{width:100%;max-width:460px;max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .2s}
@media (min-width:560px){.modal-back{align-items:center;padding:20px}.modal{border-radius:24px;padding:26px}}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(24px);opacity:0}}
.modal-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.modal-head .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--primary-weak);color:var(--primary)}
.modal-head .ico.dark{background:var(--primary);color:#fff}
.modal-head h2{font-size:19px;font-weight:800;color:var(--primary)}
.icon-btn{margin-left:auto;align-self:flex-start;width:40px;height:40px;border-radius:12px;border:none;background:var(--bg);color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.room{position:relative;cursor:pointer}
.room input{position:absolute;opacity:0;pointer-events:none}
.room span{display:flex;flex-direction:column;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg)}
.room small{font-size:12px;color:var(--muted)}
.room input:checked+span{border-color:var(--primary);background:var(--primary-weak);color:var(--primary)}
.room input:focus-visible+span{outline:2px solid var(--primary)}
.center{text-align:center}
.amount{min-height:44px;display:flex;align-items:center;padding:0 12px;border-radius:10px;background:var(--primary-weak);color:var(--primary);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.price-line{font-size:13px;margin-top:4px;color:var(--muted)}
.price-line b,.total-amt{color:var(--primary)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.sec .photos{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.photos.edit{margin-bottom:8px}
.photos.edit:empty{display:none}
.photo{position:relative;margin:0;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.photo img{display:block;width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.photo.missing:after{content:"사진 없음";position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--muted)}
.photo-x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.lightbox{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.86);cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
/* result table */
.tbl-edit{width:auto;border-collapse:separate;border-spacing:4px}
.tbl-edit th,.tbl-edit td{padding:0;border:none;vertical-align:middle}
.tbl-edit .input{min-width:92px;min-height:40px;padding:6px 8px;font-size:16px;text-align:center}
.tbl-edit thead .input{font-weight:700;background:var(--primary-weak);color:var(--primary)}
.th-cell{position:relative}
.th-cell .tbl-x{position:absolute;top:-7px;right:-7px}
.tbl-x{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.tbl-x:hover{color:var(--bad);border-color:var(--bad)}
.result-table th,.result-table td{border:1px solid var(--line);text-align:center}
.result-table th{background:var(--primary-weak);color:var(--primary);font-size:13px}
.sidebar nav a.locked,.tabbar a.locked{opacity:.5}
.approval{border-left:4px solid var(--warn)}
.approval.ok{border-left-color:var(--ok)}
.approval.bad{border-left-color:var(--bad)}
.quick{display:flex;flex-direction:column;gap:8px}
.quick-row{display:flex;align-items:center;gap:8px}
.quick-row .icon-btn{margin:0;align-self:center}
.quick-btn{flex:1;min-width:0;justify-content:flex-start;gap:12px;min-height:58px;padding:8px 14px;text-align:left;white-space:normal}
.quick-btn:hover{border-color:var(--primary)}
.quick-btn .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--primary-weak);color:var(--primary)}
.quick-btn b{display:block;font-size:15px}
.quick-btn small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.quick-btn .go{margin-left:auto;display:flex;color:var(--muted)}
.keep{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 16px;font-size:14px;cursor:pointer}
.keep input{width:18px;height:18px;accent-color:var(--primary)}
.keep small{font-size:12px;color:var(--muted)}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:18px 0}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
/* schedule · notices */
.sched{display:grid;gap:14px;grid-template-columns:1fr;margin-bottom:14px}
.sched>.card{margin-top:0}
@media (min-width:1100px){.sched{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}}
.cal-head{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.cal-head h2{margin:0 auto 0 0}
.cal-head .btn.sm{min-height:34px;padding:0 10px}
.cal-title{min-width:92px;text-align:center;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-wd{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:2px 0 4px}
.cal-wd:first-child{color:var(--bad)}.cal-wd:nth-child(7){color:#2b5fb8}
.cal-d{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;min-height:50px;padding:4px 2px;border:1.5px solid transparent;border-radius:9px;
  background:var(--bg);font:inherit;color:var(--text);cursor:pointer}
.cal-d:hover{border-color:var(--line)}
.cal-d.out{opacity:.38}
.cal-d.sel{border-color:var(--primary);background:var(--primary-weak)}
.cal-d .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.cal-d.sun .n{color:var(--bad)}.cal-d.sat .n{color:#2b5fb8}
.cal-d.today .n{background:var(--primary);color:#fff}
.cal-ev{display:none;width:100%;font-size:11px;line-height:1.4;padding:1px 4px;border-radius:4px;background:var(--primary);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.cal-ev.g{background:var(--info)}
.cal-more{display:none;font-size:11px;color:var(--muted);font-weight:700}
.cal-dots{display:flex;gap:3px}
.cal-dots i{width:6px;height:6px;border-radius:50%;background:var(--primary)}
.cal-dots i.g{background:var(--info)}
@media (min-width:560px){.cal-d{align-items:stretch;min-height:76px}.cal-d .n{align-self:flex-start}.cal-ev,.cal-more{display:block}.cal-dots{display:none}}
.day{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.day-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.day-sub{font-size:13px;color:var(--muted);margin:16px 0 8px}
.ev-ops{margin-left:auto;display:flex;flex:none}
.ev-ops .btn{min-height:30px}
.feed .when+.ev-ops{margin-left:0}
.ntc{border-top:1px solid var(--line);padding:10px 0}
.ntc:first-child{border-top:none;padding-top:0}
.ntc summary{display:flex;align-items:center;gap:8px;min-height:32px;cursor:pointer;list-style:none;font-weight:700}
.ntc summary::-webkit-details-marker{display:none}
.ntc summary .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ntc[open] summary .t{white-space:normal}
.ntc summary .when{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.ntc.pin summary{color:var(--primary)}
.ntc-body{margin-top:6px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:14px}

#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  max-width:calc(100% - 32px);padding:12px 18px;border-radius:12px;background:#0d2f28;color:#fff;font-size:14px;font-weight:600;transition:.2s;z-index:50;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--bad)}
@media (min-width:768px){#toast{bottom:28px}}

@media print{
  .sidebar,.tabbar,.topbar,.no-print,#toast{display:none!important}
  body{background:#fff;color:#000}
  .main{padding:0}
  .card{border:none;box-shadow:none;padding:0}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" multiple hidden data-change="importFiles">
<script>
'use strict';
/* ========== 기본 유틸 ========== */
const KEY = 'moduApp.v1', SKEY = 'moduApp.session';
const COLS = ['groups', 'students', 'plans', 'minutes', 'labLogs', 'requests', 'teachers', 'events', 'notices'];
const STATUS = ['대기', '승인', '반려', '지급완료'];
const STATUS_CLS = { 대기: 'warn', 승인: 'info', 반려: 'bad', 지급완료: 'ok' };

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const nowISO = () => new Date().toISOString();
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
// 'YYYY-MM-DD'는 그대로, ISO 시각(UTC)은 기기 현지 날짜로 바꿔 표시
const fmtDate = s => {
  if (!s) return '';
  if (s.length > 10) { const d = new Date(s); if (!isNaN(d)) return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`; }
  return s.slice(0, 10).replace(/-/g, '.');
};
const daysAgo = iso => Math.floor((Date.now() - new Date(iso).getTime()) / 864e5);
const relDays = iso => { if (!iso) return '기록 없음'; const d = daysAgo(iso); return d <= 0 ? '오늘' : d + '일 전'; };
const byKo = k => (a, b) => String(a[k]).localeCompare(String(b[k]), 'ko', { numeric: true });

let toastTimer;
function toast(msg, cls = '') {
  const t = $('#toast');
  t.textContent = msg; t.className = 'show ' + cls;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = cls; }, 2600);
}

/* ========== 비밀번호 해시 ========== */
// file://이나 일부 모바일 환경에서 crypto.subtle이 없을 수 있어 폴백 해시도 함께 저장
function fnv(str) {
  let h1 = 0x811c9dc5, h2 = 0x5bd1e995;
  for (const ch of str) {
    const c = ch.codePointAt(0);
    h1 = Math.imul(h1 ^ c, 16777619);
    h2 = Math.imul(h2 ^ c, 2246822519) ^ (h2 >>> 13);
  }
  return (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0');
}
async function sha(str) {
  if (!(window.crypto && crypto.subtle)) return null;
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
  } catch (e) { return null; }
}
// 교사 코드는 숫자 4자리만 허용
const isCode = v => /^\d{4}$/.test(v || '');
const CODE_HINT = '<b class="hint">숫자 4자리를 입력하세요.</b>';
const CODE_INPUT = 'class="input" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" required title="교사 코드는 숫자 4자리입니다." placeholder="숫자 4자리 (예: 1234)" data-input="digits"';
async function makePw(pw) { const salt = uid(); return { salt, s: await sha(salt + pw), f: fnv(salt + pw) }; }
async function checkPw(pw, rec) {
  if (!rec) return false;
  if (rec.s) { const s = await sha(rec.salt + pw); if (s) return s === rec.s; }
  return fnv(rec.salt + pw) === rec.f;
}

/* ========== 저장소 ========== */
// 삭제는 deleted 표시(soft delete)로 남겨 다른 기기와 병합할 때 되살아나지 않게 한다.
// feedback/review는 교사·학생 기기에서 따로 바뀌므로 필드별 시각(at)으로 병합한다.
const FIELD_TS = ['feedback', 'review'];
const Store = {
  d: null,
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) { }
    d = d && typeof d === 'object' ? d : {};
    d.settings = d.settings || null;
    COLS.forEach(c => { if (!Array.isArray(d[c])) d[c] = []; });
    this.d = d;
  },
  save() {
    try { localStorage.setItem(KEY, JSON.stringify(this.d)); }
    catch (e) { toast('저장하지 못했습니다. 브라우저 저장 공간을 확인하세요.', 'bad'); }
  },
  all(c) { return this.d[c].filter(r => !r.deleted); },
  get(c, id) { return this.d[c].find(r => r.id === id && !r.deleted); },
  put(c, rec) {
    const t = nowISO();
    rec.updatedAt = t; if (!rec.createdAt) rec.createdAt = t;
    const i = this.d[c].findIndex(r => r.id === rec.id);
    if (i >= 0) this.d[c][i] = rec; else this.d[c].push(rec);
    this.save();
    return rec;
  },
  del(c, id) {
    const r = this.d[c].find(r => r.id === id);
    if (r) { r.deleted = true; r.updatedAt = nowISO(); this.save(); }
  },
  setSettings(patch) {
    this.d.settings = { ...(this.d.settings || {}), ...patch, updatedAt: nowISO() };
    this.save();
  },
  merge(inc) {
    if (!inc || typeof inc !== 'object' || inc.app !== 'moduApp') throw new Error('모둠 관리 앱 데이터 파일이 아닙니다.');
    let added = 0, updated = 0;
    if (inc.settings && (!this.d.settings || (inc.settings.updatedAt || '') > (this.d.settings.updatedAt || ''))) this.d.settings = inc.settings;
    COLS.forEach(c => {
      (Array.isArray(inc[c]) ? inc[c] : []).forEach(r => {
        if (!r || !r.id) return;
        const i = this.d[c].findIndex(x => x.id === r.id);
        if (i < 0) { this.d[c].push(r); added++; return; }
        const cur = this.d[c][i];
        const win = { ...((r.updatedAt || '') > (cur.updatedAt || '') ? r : cur) };
        FIELD_TS.forEach(k => {
          const a = cur[k], b = r[k];
          const best = !a ? b : !b ? a : ((b.at || '') > (a.at || '') ? b : a);
          if (best) win[k] = best;
        });
        if (JSON.stringify(win) !== JSON.stringify(cur)) { this.d[c][i] = win; updated++; }
      });
    });
    this.save();
    return { added, updated };
  }
};

/* ========== 로그인/권한 ========== */
// 학생 편의 기능: 이 기기에서 입장했던 계정과 마지막 교사 코드를 기억
const RKEY = 'moduApp.remember';
const Remember = {
  get() {
    let r = null;
    try { r = JSON.parse(localStorage.getItem(RKEY)); } catch (e) { }
    return { lastCode: (r && r.lastCode) || '', accounts: (r && Array.isArray(r.accounts)) ? r.accounts : [] };
  },
  save(r) { try { localStorage.setItem(RKEY, JSON.stringify(r)); } catch (e) { } },
  add(id, name) { const r = this.get(); r.accounts = [{ id, name }, ...r.accounts.filter(a => a.id !== id)].slice(0, 5); this.save(r); },
  forget(id) { const r = this.get(); r.accounts = r.accounts.filter(a => a.id !== id); this.save(r); },
  setCode(code) { const r = this.get(); r.lastCode = code; this.save(r); }
};

const Auth = {
  me: null,
  load() {
    let me = null;
    try { me = JSON.parse(sessionStorage.getItem(SKEY)) || JSON.parse(localStorage.getItem(SKEY)); } catch (e) { }
    if (me && me.role === 'student') {
      const s = Store.get('students', me.id);
      if (!s || s.name !== me.name) me = null;
      else me.groupId = s.groupId || '';
    }
    this.me = me;
  },
  // keep: 브라우저를 닫아도 로그인 유지 (학생 개인 기기용)
  set(me, keep) {
    this.me = me;
    sessionStorage.setItem(SKEY, JSON.stringify(me));
    try { if (keep) localStorage.setItem(SKEY, JSON.stringify(me)); else localStorage.removeItem(SKEY); } catch (e) { }
  },
  logout() { this.me = null; sessionStorage.removeItem(SKEY); try { localStorage.removeItem(SKEY); } catch (e) { } go('#/'); },
  get isT() { return !!this.me && this.me.role === 'teacher'; }
};

const reqStatus = r => (r.review && r.review.status) || '대기';

// 탐구 계획서 승인: 모둠 계획서가 하나라도 승인되면 그 모둠의 실험일지·준비물 신청이 열린다
const PLAN_STATUS = ['대기', '승인', '보완 요청'];
const PLAN_CLS = { 대기: 'warn', 승인: 'ok', '보완 요청': 'bad' };
const PLAN_LABEL = { 대기: '승인 대기', 승인: '승인됨', '보완 요청': '보완 요청' };
const LOCKED_PAGES = ['lab', 'supplies'];
const planStatus = r => (r.review && r.review.status) || '대기';
const planBadge = r => `<span class="badge ${PLAN_CLS[planStatus(r)]}">${PLAN_LABEL[planStatus(r)]}</span>`;
const groupApproved = gid => !!gid && Store.all('plans').some(p => p.groupId === gid && planStatus(p) === '승인');
const latestPlan = gid => Store.all('plans').filter(p => p.groupId === gid).sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''))[0];

// 교사 개인 코드: MO.s_yymmdd_순번 (처음 로그인한 날짜 기준, 그날 가입한 순서)
// 삭제된 기록까지 세어 같은 날 번호가 다시 쓰이지 않게 한다.
function ensureTeacher(name) {
  const found = Store.all('teachers').find(t => t.name === name);
  if (found) return { teacher: found, isNew: false };
  const ymd = today().slice(2).replace(/-/g, '');
  const seq = Store.d.teachers.filter(t => t.joinDate === ymd).length + 1;
  const teacher = Store.put('teachers', { id: uid(), name, joinDate: ymd, code: `MO.s_${ymd}_${seq}` });
  return { teacher, isNew: true };
}
const teacherCode = name => { const t = Store.all('teachers').find(t => t.name === name); return t ? t.code : ''; };

// 화면 표시와 저장 처리 양쪽에서 같은 규칙으로 검사한다.
function can(act, rec, col) {
  const me = Auth.me; if (!me) return false;
  const T = me.role === 'teacher';
  const mine = rec && rec.authorId === me.id;
  switch (act) {
    case 'view': return T || rec.groupId === me.groupId;
    case 'write': return !T && !!me.groupId && !!Store.get('groups', me.groupId);
    // 처리된 준비물 신청과 승인된 계획서는 학생이 고치거나 지울 수 없다
    case 'edit': return !T && mine && (col !== 'requests' || reqStatus(rec) === '대기') && (col !== 'plans' || planStatus(rec) !== '승인');
    case 'delete': return T || (mine && (col !== 'requests' || reqStatus(rec) === '대기') && (col !== 'plans' || planStatus(rec) !== '승인'));
    case 'unlocked': return T || groupApproved(me.groupId);
    case 'feedback': case 'review': case 'admin': return T;
  }
  return false;
}

/* ========== 공통 화면 조각 ========== */
const UI = {
  modal: null,   // 'student' | 'teacher'
  next: null,    // 학생 로그인 후 이동할 화면
  editReq: null,
  reportGroup: '', reportFb: true,
  calMonth: today().slice(0, 7), calDay: today(), editEvent: null, eventDraft: null, editNotice: null, allNotices: false,
  filters: { plan: { group: '', q: '' }, minutes: { group: '', q: '' }, lab: { group: '', q: '' }, supplies: { group: '', status: '대기' } }
};

function go(hash) { if (location.hash === hash) render(true); else location.hash = hash; }
const club = () => (Store.d.settings && Store.d.settings.clubName) || '모둠 관리';
function groupName(id) {
  const g = Store.d.groups.find(g => g.id === id);
  return g && !g.deleted ? g.name : (id ? '(삭제된 모둠)' : '모둠 없음');
}
const groupsSorted = () => Store.all('groups').sort(byKo('name'));
const studentsOf = gid => Store.all('students').filter(s => s.groupId === gid).sort(byKo('name'));
function groupOptions(sel, placeholder) {
  return (placeholder != null ? `<option value="">${esc(placeholder)}</option>` : '') +
    groupsSorted().map(g => `<option value="${esc(g.id)}"${g.id === sel ? ' selected' : ''}>${esc(g.name)}</option>`).join('');
}
const badge = s => `<span class="badge ${STATUS_CLS[s]}">${s}</span>`;
const empty = (icon, msg) => `<div class="empty"><div class="big">${icon}</div>${msg}</div>`;
const notFound = (msg = '찾을 수 없거나 볼 권한이 없는 항목입니다.') =>
  ({ title: '알림', html: `${empty('🔒', esc(msg))}<p style="text-align:center;margin-top:14px"><a class="btn" href="#/dashboard">대시보드로</a></p>` });

function noGroupNotice() {
  if (Auth.isT || can('write')) return '';
  return `<div class="notice">아직 모둠에 배정되지 않았어요. 선생님께 모둠 배정을 요청하세요. 선생님 기기에서 내보낸 데이터 파일을 <a href="#/data">내 데이터</a>에서 가져오면 반영됩니다.</div>`;
}

/* ========== 탐구 계획서 · 회의록 · 실험일지 공통 ========== */
const J = {
  plan: {
    col: 'plans', name: '탐구 계획서', icon: '🧭', dateLabel: '작성일', memberLabel: '참여자', titleLabel: '탐구 주제',
    fields: [
      ['motivation', '탐구 동기', true, '이 주제에 관심을 갖게 된 계기나 일상 속 궁금증'],
      ['purpose', '탐구 목적', true, '이 탐구로 무엇을 알아내거나 해결하려고 하나요?'],
      ['priorResearch', '선행연구 분석 및 차별성', false, '참고한 논문·자료의 내용을 정리하고, 우리 탐구가 무엇이 다른지 적어 주세요']
    ]
  },
  minutes: {
    col: 'minutes', name: '회의록', icon: '📝', dateLabel: '회의 날짜', memberLabel: '참석자', photos: true,
    fields: [
      ['agenda', '안건', false, '오늘 논의할 주제'],
      ['content', '논의 내용', true, '누가 어떤 의견을 냈는지 정리해 주세요'],
      ['decisions', '결정 사항', false, ''],
      ['todo', '역할 분담 (R&R) · 다음 할 일', false, '예) 김민지 - 자료 조사 (다음 주 화요일까지)']
    ]
  },
  lab: {
    col: 'labLogs', name: '실험일지', icon: '🧪', dateLabel: '실험 날짜', memberLabel: '참여자', photos: true, table: true,
    fields: [
      ['purpose', '실험 목적', true, ''],
      ['hypothesis', '가설', false, ''],
      ['varIndependent', '독립 변인', false, '일부러 바꾸는 조건', true],
      ['varDependent', '종속 변인', false, '측정하는 값', true],
      ['varControlled', '통제 변인', false, '똑같이 유지하는 조건', true],
      ['materials', '준비물 · 재료', false, ''],
      ['method', '실험 방법', false, '순서대로 적어 주세요'],
      ['result', '결과 및 관찰', false, '관찰한 현상이나 결과 해석 (측정값은 아래 표에 정리해도 돼요)'],
      ['errorAnalysis', '오차 분석', false, '오차가 생긴 원인과 줄이는 방법'],
      ['conclusion', '결론 및 느낀 점', false, '']
    ]
  }
};
// 받침 유무에 따라 조사 선택 (예: 회의록이 / 실험일지가)
const josa = (word, withF, withoutF) => { const c = word.charCodeAt(word.length - 1) - 0xac00; return c >= 0 && c <= 11171 && c % 28 ? withF : withoutF; };
const kindOfCol =col => Object.keys(J).find(k => J[k].col === col);
const snippet = (r, cfg) => { const f = cfg.fields.find(([k]) => r[k]); return f ? r[f[0]].replace(/\s+/g, ' ').slice(0, 120) : ''; };

function journalItems(kind) {
  const cfg = J[kind], f = UI.filters[kind], q = f.q.trim().toLowerCase(), T = Auth.isT;
  let rows = Store.all(cfg.col).filter(r => can('view', r));

/* ========== 사진 첨부 · 결과 표 ========== */
// localStorage는 약 5MB뿐이라 사진은 브라우저 IndexedDB에 따로 저장하고, 기록에는 사진 id만 남긴다.
const MAX_PHOTOS = 6;
const PhotoDB = {
  db: null, cache: new Map(),
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('이 브라우저는 사진 저장을 지원하지 않아요.'));
      const req = indexedDB.open('moduApp.photos', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('photos');
      req.onsuccess = () => res(this.db = req.result);
      req.onerror = () => rej(req.error || new Error('사진 저장소를 열 수 없어요.'));
    });
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('photos', mode); let out;
      fn(t.objectStore('photos'), v => { out = v; });
      t.oncomplete = () => res(out); t.onerror = t.onabort = () => rej(t.error || new Error('사진을 저장하지 못했어요.'));
    });
  },
  async put(id, data) { await this.tx('readwrite', st => st.put(data, id)); this.cache.set(id, data); },
  async putMany(map) {
    const entries = Object.entries(map || {});
    if (!entries.length) return 0;
    await this.tx('readwrite', st => entries.forEach(([id, d]) => st.put(d, id)));
    entries.forEach(([id, d]) => this.cache.set(id, d));
    return entries.length;
  },
  async get(id) {
    if (this.cache.has(id)) return this.cache.get(id);
    const v = await this.tx('readonly', (st, set) => { const q = st.get(id); q.onsuccess = () => set(q.result); });
    if (v) this.cache.set(id, v);
    return v;
  },
  async getMany(ids) { const out = {}; for (const id of ids) { const v = await this.get(id); if (v) out[id] = v; } return out; },
  async remove(ids) { if (!ids.length) return; await this.tx('readwrite', st => ids.forEach(id => st.delete(id))); ids.forEach(id => this.cache.delete(id)); }
};

// 긴 변을 1280px로 줄이고 JPEG로 압축 (투명 배경은 흰색으로)
function compressImage(file, max = 1280, q = 0.72) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error(`${file.name}: 이미지를 읽을 수 없어요.`)); };
    img.src = url;
  });
}

// 화면에 그려진 사진 자리(img[data-photo])에 IndexedDB의 사진을 채워 넣는다
function hydratePhotos(root = document) {
  $$('img[data-photo]:not([src])', root).forEach(async img => {
    try {
      const v = await PhotoDB.get(img.dataset.photo);
      if (v) img.src = v; else img.parentNode.classList.add('missing');
    } catch (e) { img.parentNode.classList.add('missing'); }
  });
}

}

const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const dayLabel = s => { const d = new Date(s + 'T00:00:00'); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEK[d.getDay()]})`; };
// 학생은 전체 일정과 자기 모둠 일정만 본다
const eventsFor = () => Store.all('events').filter(e => Auth.isT || !e.groupId || e.groupId === Auth.me.groupId);
const eventOn = (e, day) => e.date <= day && day <= (e.endDate || e.date);
const evSort = (a, b) => a.date.localeCompare(b.date) || (a.createdAt || '').localeCompare(b.createdAt || '');
const evRange = e => e.endDate ? `${dayLabel(e.date)} ~ ${dayLabel(e.endDate)}` : dayLabel(e.date);
const evTarget = e => `<span class="badge ${e.groupId ? 'info' : 'pri'}">${esc(e.groupId ? groupName(e.groupId) : '전체')}</span>`;
function dday(e) {
  const td = today();
  if (e.date <= td) return '진행 중';
  const n = Math.round((new Date(e.date + 'T00:00:00') - new Date(td + 'T00:00:00')) / 864e5);
  return n === 1 ? '내일' : `D-${n}`;
}

function calendarHTML(E) {
  const [y, m] = UI.calMonth.split('-').map(Number), first = new Date(y, m - 1, 1);
  const weeks = Math.ceil((first.getDay() + new Date(y, m, 0).getDate()) / 7), td = today();
  let cells = '';
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(y, m - 1, 1 - first.getDay() + i), key = ymd(d), evs = E.filter(e => eventOn(e, key)).sort(evSort);
    const cls = ['cal-d', d.getMonth() !== m - 1 && 'out', key === td && 'today', key === UI.calDay && 'sel', d.getDay() === 0 && 'sun', d.getDay() === 6 && 'sat'].filter(Boolean).join(' ');
    cells += `<button type="button" class="${cls}" data-act="calPick" data-date="${key}" aria-label="${dayLabel(key)}${evs.length ? `, 일정 ${evs.length}개` : ''}"><span class="n">${d.getDate()}</span>`
      + evs.slice(0, 2).map(e => `<span class="cal-ev${e.groupId ? ' g' : ''}">${esc(e.title)}</span>`).join('')
      + (evs.length > 2 ? `<span class="cal-more">+${evs.length - 2}</span>` : '')
      + (evs.length ? `<span class="cal-dots">${evs.slice(0, 3).map(e => `<i${e.groupId ? ' class="g"' : ''}></i>`).join('')}</span>` : '')
      + '</button>';
  }
  return `<div class="cal">${WEEK.map(w => `<div class="cal-wd">${w}</div>`).join('')}${cells}</div>`;
}

/* ========== 대시보드 ========== */
function mondayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
function weeklyBars(records) {
  const thisWeek = mondayOf(new Date()), counts = Array(8).fill(0);
  records.forEach(r => {
    const d = new Date((r.date || (r.createdAt || '').slice(0, 10)) + 'T00:00:00');
    if (isNaN(d)) return;
    const diff = Math.round((thisWeek - mondayOf(d)) / (7 * 864e5));
    if (diff >= 0 && diff < 8) counts[7 - diff]++;
  });
  const max = Math.max(1, ...counts);
  return `<div class="bars">${counts.map((n, i) => {
    const w = new Date(thisWeek); w.setDate(w.getDate() - (7 - i) * 7);
    return `<div class="bar" title="${w.getMonth() + 1}/${w.getDate()} 주: ${n}건"><b>${n || ''}</b><i style="height:${Math.round(n / max * 100)}%"></i><span>${i === 7 ? '이번 주' : `${w.getMonth() + 1}/${w.getDate()}`}</span></div>`;
  }).join('')}</div>`;
}

function dashTeacher() {
  const G = groupsSorted(), S = Store.all('students'), P = Store.all('plans'), M = Store.all('minutes'), L = Store.all('labLogs'), R = Store.all('requests');

    const mem = studentsOf(g.id);
    const last = [...gpl, ...gm, ...gl, ...gr].map(r => r.updatedAt || r.createdAt).sort().pop();

    ${!G.length ? '<div class="notice info">먼저 <a href="#/admin">관리</a>에서 모둠과 학생 명단을 등록하세요. 등록 후 데이터를 내보내 학생 기기에서 가져오게 하면 학생들이 로그인할 수 있어요.</div>' : ''}
    ${tilesHTML([['모둠', G.length, ''], ['학생', S.length, unassigned ? `미배정 ${unassigned}명` : ''], ['탐구 계획서', P.length, P.some(p => planStatus(p) === '대기') ? `승인 대기 ${P.filter(p => planStatus(p) === '대기').length}건` : ''], ['회의록', M.length, ''], ['실험일지', L.length, ''], ['대기 중 신청', pending, pending ? '처리 필요' : '']])}

function dashStudent() {

  const M = Store.all('minutes').filter(r => r.groupId === gid), L = Store.all('labLogs').filter(r => r.groupId === gid);
  const R = Store.all('requests').filter(r => r.groupId === gid);
  const mineR = R.filter(r => r.authorId === me.id);
  const fbs = [...P.map(r => ['plan', r]), ...M.map(r => ['minutes', r]), ...L.map(r => ['lab', r])].filter(([, r]) => r.feedback && r.feedback.text)

    ${noGroupNotice()}
    ${gid && !can('unlocked') ? (() => {

        : planStatus(lp) === '보완 요청' ? `<a href="#/plan/${esc(lp.id)}">탐구 계획서</a>에 선생님의 보완 요청이 있어요. 수정해서 다시 제출하세요.`

    ${tilesHTML([['탐구 계획서', P.length, ''], ['회의록', M.length, ''], ['실험일지', L.length, ''], ['내 신청 대기', mineR.filter(r => reqStatus(r) === '대기').length, ''], ['승인 · 지급', mineR.filter(r => ['승인', '지급완료'].includes(reqStatus(r))).length, '']])}
    <div class="grid c2">
      <div class="card"><h2>🕒 우리 모둠 최근 활동</h2>${feedList(M, L, R, false, P)}</div>
      <div class="stack">
        <div class="card"><h2>💬 선생님 피드백</h2>${fbs.length ? `<ul class="feed">${fbs.map(([k, r]) => `<li><span class="badge info">${J[k].name}</span><div style="min-width:0"><a href="#/${k}/${esc(r.id)}">${esc(r.title)}</a><div class="muted sm pre">${esc(r.feedback.text.slice(0, 80))}</div></div><span class="when">${relDays(r.feedback.at)}</span></li>`).join('')}</ul>` : '<p class="muted">아직 받은 피드백이 없어요.</p>'}</div>
        <div class="card"><h2>📦 내 준비물 신청</h2>${mineR.length ? `<ul class="feed">${mineR.slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt)).slice(0, 5).map(r => `<li>${badge(reqStatus(r))}<div style="min-width:0"><a href="#/supplies">${esc(r.item)} × ${esc(r.qty)}${esc(r.unit || '')}</a>${r.review && r.review.note ? `<div class="muted sm">${esc(r.review.note)}</div>` : ''}</div><span class="when">${relDays(r.createdAt)}</span></li>`).join('')}</ul>` : '<p class="muted">신청 내역이 없어요.</p>'}</div>

function reportRecords(gid) {
  const byDate = (a, b) => (a.date || '').localeCompare(b.date || '') || (a.createdAt || '').localeCompare(b.createdAt || '');
  const plans = Store.all('plans').filter(p => p.groupId === gid);
  const approved = plans.filter(p => planStatus(p) === '승인').sort(byDate);
  const lp = latestPlan(gid);
  return {
    plans: approved.length ? approved : lp ? [lp] : [],
    minutes: Store.all('minutes').filter(r => r.groupId === gid).sort(byDate),
    labs: Store.all('labLogs').filter(r => r.groupId === gid).sort(byDate)
  };
}

// src(id): 사진 id → 이미지 주소. null이면 앱 화면처럼 data-photo로 남겨 나중에 채운다.
function reportHTML(gid, { src = () => null, feedback = true } = {}) {
  const { plans, minutes, labs } = reportRecords(gid);
  const all = [...plans, ...minutes, ...labs], dates = all.map(r => r.date).filter(Boolean).sort();
  const main = plans[0];
  const approver = main && planStatus(main) === '승인' && main.review && main.review.by;
  const img = id => { const s = src(id); return s ? `<img src="${s}" alt="첨부 사진">` : s === null ? `<img data-photo="${esc(id)}" alt="첨부 사진" data-act="viewPhoto">` : ''; };
  const entry = (kind, r, n) => {
    const cfg = J[kind];
    const tag = kind === 'plan' ? `<span class="rep-badge${planStatus(r) === '승인' ? '' : ' warn'}">${PLAN_LABEL[planStatus(r)]}</span>` : '';
    const sections = cfg.fields.map(([k, label]) => {
      const tbl = k === 'result' && cfg.table && tableHasData(r.resultTable)
        ? `<table class="rep-table"><thead><tr>${r.resultTable.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${r.resultTable.rows.filter(row => row.some(c => c)).map(row => `<tr>${row.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>` : '';
      return r[k] || tbl ? `<h4>${label}</h4>${tbl}${r[k] ? `<p>${esc(r[k])}</p>` : ''}` : '';
    }).join('');
    const photos = (r.photos || []).map(img).filter(Boolean);
    return `<div class="rep-entry">
      <h3>${n ? n + '. ' : ''}${esc(r.title)}${tag}</h3>
      <div class="rep-info">${cfg.dateLabel} ${fmtDate(r.date)} · 작성 ${esc(r.authorName)}${r.attendees && r.attendees.length ? ` · ${cfg.memberLabel} ${r.attendees.map(esc).join(', ')}` : ''}</div>
      ${sections}
      ${photos.length ? `<h4>사진</h4><div class="rep-photos">${photos.map(p => `<figure>${p}</figure>`).join('')}</div>` : ''}
      ${feedback && r.feedback && r.feedback.text ? `<div class="rep-fb"><b>선생님 피드백</b> (${esc(r.feedback.by)} · ${fmtDate(r.feedback.at)})<br>${esc(r.feedback.text).replace(/\n/g, '<br>')}</div>` : ''}
    </div>`;
  };
  const section = (no, title, kind, rows, emptyMsg) => `
    <section class="rep-section"><h2>${no}. ${title}</h2>
      ${rows.length ? rows.map((r, i) => entry(kind, r, rows.length > 1 || kind !== 'plan' ? i + 1 : 0)).join('') : `<p class="rep-empty">${emptyMsg}</p>`}
    </section>`;
  return `<article class="report">
    <header class="rep-cover">
      <div class="rep-kicker">SCIENCE INQUIRY REPORT</div>
      <h1>${esc(main ? main.title : groupName(gid) + ' 탐구 보고서')}</h1>
      <div class="rep-sub">탐구 보고서</div>
      <dl class="rep-meta">
        <dt>동아리</dt><dd>${esc(club())}</dd>
        <dt>모둠</dt><dd>${esc(groupName(gid))}</dd>
        <dt>모둠원</dt><dd>${studentsOf(gid).map(s => esc(s.name)).join(', ') || '-'}</dd>
        <dt>탐구 기간</dt><dd>${dates.length ? `${fmtDate(dates[0])} ~ ${fmtDate(dates[dates.length - 1])}` : '-'}</dd>
        ${approver ? `<dt>지도 교사</dt><dd>${esc(approver)}</dd>` : ''}
        <dt>작성일</dt><dd>${fmtDate(today())}</dd>
      </dl>
    </header>
    <nav class="rep-toc"><b>목차</b><ol type="I">
      <li>탐구 계획</li><li>회의록 (${minutes.length}건)</li><li>실험일지 (${labs.length}건)</li>
    </ol></nav>
    ${section('I', '탐구 계획', 'plan', plans, '작성된 탐구 계획서가 없습니다.')}
    ${section('II', '회의록', 'minutes', minutes, '작성된 회의록이 없습니다.')}
    ${section('III', '실험일지', 'lab', labs, '작성된 실험일지가 없습니다.')}
  </article>`;
}

function pageReport() {
  const T = Auth.isT, G = groupsSorted();
  if (T && !Store.get('groups', UI.reportGroup)) UI.reportGroup = G.length ? G[0].id : '';
  const gid = T ? UI.reportGroup : Auth.me.groupId;
  const head = `<div class="page-head no-print"><div><h1>📘 탐구 보고서</h1><p class="muted">탐구 계획서 · 회의록 · 실험일지를 한 문서로 모아 봅니다.</p></div></div>`;
  if (!gid) return { title: '탐구 보고서', html: head + (T ? empty('📘', '먼저 모둠을 만들어 주세요.') : noGroupNotice()) };
  const { plans, minutes, labs } = reportRecords(gid);
  const toolbar = T ? `
    <div class="filters no-print" style="align-items:center">
      <select class="input" data-change="reportGroup" aria-label="모둠 선택">${groupOptions(gid)}</select>
      <label class="keep" style="margin:0"><input type="checkbox" data-change="reportFb"${UI.reportFb ? ' checked' : ''}>선생님 피드백 포함</label>
      <div class="btns" style="margin-left:auto">
        <button class="btn" data-act="print">${icon('printer', 18)}인쇄 · PDF</button>
        <button class="btn primary" data-act="saveReport">${icon('download', 18)}파일 저장</button>
      </div>
    </div>` : `<div class="notice info no-print">우리 모둠이 쓴 기록이 자동으로 모인 보고서예요. 저장과 인쇄는 선생님이 할 수 있어요.</div>`;
  return {
    title: '탐구 보고서', html: head + toolbar + (plans.length + minutes.length + labs.length
      ? reportHTML(gid, { feedback: T ? UI.reportFb : true })
      : empty('📘', '아직 보고서에 담을 기록이 없어요. 계획서, 회의록, 실험일지를 작성하면 여기에 모여요.'))
  };
}

function render(toTop) {
  Store.load(); Auth.load();
  const app = $('#app');
  document.body.classList.toggle('lock', !Auth.me && !!UI.modal);
  if (!Auth.me) {
    app.innerHTML = viewLanding();
    document.title = '탐구노트 | 과학 탐구 기록장';
    const first = $('.modal input:not([type=radio])');
    if (first && matchMedia('(min-width:768px)').matches) first.focus();
    return;
  }
  let [page = 'dashboard', a, b] = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  let view;
  if (LOCKED_PAGES.includes(page) && !can('unlocked')) {
    app.innerHTML = shell(page, lockedView(page).html);
    document.title = '계획서 승인 필요 · 탐구노트';
    if (toTop) window.scrollTo(0, 0);
    return;
  }
  switch (page) {
    case 'plan': case 'minutes': case 'lab':
      view = !a ? pageJournalList(page) : a === 'new' ? pageJournalForm(page) : b === 'edit' ? pageJournalForm(page, a) : pageJournalDetail(page, a);
      break;
    case 'supplies': view = pageSupplies(); break;
    case 'admin': view = can('admin') ? pageAdmin() : notFound('교사만 볼 수 있는 화면입니다.'); break;
    case 'data': view = pageData(); break;
    case 'report': view = pageReport(); break;
    default: page = 'dashboard'; view = Auth.isT ? dashTeacher() : dashStudent();
  }
  app.innerHTML = shell(page, view.html);
  document.title = `${view.title} · 탐구노트`;
  hydratePhotos(app);
  if (toTop) window.scrollTo(0, 0);
}

/* ========== 내보내기 · 가져오기 ========== */
function download(obj, name) {
  const blob = new Blob([JSON.stringify(obj)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const fileSafe = s => String(s).replace(/[\\/:*?"<>|\s]+/g, '_');

/* ========== 엑셀(.xlsx) 만들기 ========== */
// 외부 라이브러리 없이 동작하도록 xlsx(압축하지 않은 zip + XML)를 직접 만든다.
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(bytes) { let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files, type) {
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  files.forEach(({ name, text }) => {
    const nm = enc.encode(name), data = enc.encode(text), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(12, 0x21, true); lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, nm.length, true);
    parts.push(new Uint8Array(lh.buffer), nm, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(14, 0x21, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, nm.length, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nm);
    offset += 30 + nm.length + data.length;
  });
  const size = central.reduce((s, p) => s + p.length, 0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, size, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type });
}
const xmlEsc = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const colName = i => { let s = ''; for (i++; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s; return s; };
function xlsxBlob(sheetName, head, rows, { widths = [], numCols = [], total } = {}) {
  // 스타일: 0 기본, 1 머리글(굵게+배경), 2 숫자(#,##0), 3 합계(굵게 숫자), 4 굵게 글자
  const cell = (v, ref, style) => typeof v === 'number'
    ? `<c r="${ref}" s="${style || 2}"><v>${v}</v></c>`
    : `<c r="${ref}" t="inlineStr"${style ? ` s="${style}"` : ''}><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
  const xmlRows = [`<row r="1">${head.map((h, j) => cell(String(h), colName(j) + 1, 1)).join('')}</row>`];
  rows.forEach((row, i) => xmlRows.push(`<row r="${i + 2}">${row.map((v, j) => v === '' ? '' : cell(numCols.includes(j) ? Number(v) || 0 : String(v), colName(j) + (i + 2))).join('')}</row>`));
  if (total) {
    const r = rows.length + 2;
    xmlRows.push(`<row r="${r}">${cell(total.label, colName(total.labelCol) + r, 4)}<c r="${colName(total.col)}${r}" s="3"><f>${xmlEsc(total.formula(rows.length))}</f></c></row>`);
  }
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main', RNS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="${NS}"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`
    + (widths.length ? `<cols>${widths.map((w, j) => `<col min="${j + 1}" max="${j + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '')
    + `<sheetData>${xmlRows.join('')}</sheetData></worksheet>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${NS}"><numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0"/></numFmts>`
    + `<fonts count="2"><font><sz val="11"/><name val="맑은 고딕"/></font><font><b/><sz val="11"/><name val="맑은 고딕"/></font></fonts>`
    + `<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE3EFE9"/><bgColor indexed="64"/></patternFill></fill></fills>`
    + `<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>`
    + `<cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>`
    + `<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="164" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>`
    + `<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  return zipStore([
    { name: '[Content_Types].xml', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>` },
    { name: '_rels/.rels', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${RNS}/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name: 'xl/workbook.xml', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}" xmlns:r="${RNS}"><sheets><sheet name="${xmlEsc(sheetName)}" sheetId="1" r:id="rId1"/></sheets></workbook>` },
    { name: 'xl/_rels/workbook.xml.rels', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${RNS}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${RNS}/styles" Target="styles.xml"/></Relationships>` },
    { name: 'xl/worksheets/sheet1.xml', text: sheet },
    { name: 'xl/styles.xml', text: styles }
  ], 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

async function importFiles(files) {
  let added = 0, updated = 0, photos = 0; const errs = [];
  for (const file of files) {
    try {
      const inc = JSON.parse(await file.text());
      const r = Store.merge(inc); added += r.added; updated += r.updated;
      if (inc.photos) photos += await PhotoDB.putMany(inc.photos);
    }
    catch (e) { errs.push(`${file.name}: ${e.message || '읽기 실패'}`); }
  }
  render();
  if (errs.length) toast(`가져오기 실패 — ${errs.join(' / ')}`, 'bad');
  else toast(`가져오기 완료: 새 항목 ${added}개, 갱신 ${updated}개${photos ? `, 사진 ${photos}장` : ''}`);
}

  reqCalc: el => {
    const f = el.form, out = $('#req-amount');
    if (out) out.textContent = won((Number(f.qty.value) || 0) * (Number(f.price.value) || 0));
  },
  addPhotos: async el => {
    const files = [...el.files]; el.value = '';
    const room = MAX_PHOTOS - UI.formPhotos.length;
    if (room <= 0) return toast(`사진은 최대 ${MAX_PHOTOS}장까지 첨부할 수 있어요.`, 'bad');
    if (files.length > room) toast(`최대 ${MAX_PHOTOS}장이라 ${room}장만 추가할게요.`);
    for (const f of files.slice(0, room)) {
      try {
        const data = await compressImage(f), pid = 'ph_' + uid();
        await PhotoDB.put(pid, data);
        UI.formPhotos.push(pid);
      } catch (e) { toast(e.message || '사진을 추가하지 못했어요.', 'bad'); }
    }
    refreshPhotoList();
  },
  digits: el => { const v = el.value.replace(/\D/g, '').slice(0, 4); if (v !== el.value) el.value = v; },
  checkAll: el => $$('.req-check').forEach(c => c.checked = el.checked),
  setStudentGroup: el => {
    const s = Store.get('students', el.dataset.id);
    if (!s || !can('admin')) return;
    Store.put('students', { ...s, groupId: el.value }); toast(`${s.name} → ${groupName(el.value)}`);
  }
};

function addOrFindGroup(name) {
  const g = Store.all('groups').find(g => g.name === name);
  return g || Store.put('groups', { id: uid(), name });
}

function enterStudent(s, keep, msg) {
  Auth.set({ role: 'student', id: s.id, name: s.name }, keep);
  if (keep) Remember.add(s.id, s.name);
  const next = UI.next;
  UI.modal = null; UI.next = null;
  go(next || '#/dashboard');
  toast(msg);
}

const Forms = {
  async setup(f, fd) {
    const pw = fd.get('pw');
    if (!isCode(pw)) return toast('교사 코드는 숫자 4자리로 입력하세요.', 'bad');
    if (pw !== fd.get('pw2')) return toast('코드 확인이 일치하지 않아요.', 'bad');
    const teacherName = fd.get('teacherName').trim();
    Store.setSettings({ clubName: fd.get('clubName').trim(), teacherName, pw: await makePw(pw) });
    const { teacher } = ensureTeacher(teacherName);
    Auth.set({ role: 'teacher', name: teacherName });
    UI.modal = null;
    go('#/admin'); toast(`준비 완료! 개인 코드 ${teacher.code}가 배정되었어요.`);
  },
  loginStudent(f, fd) {
    const name = fd.get('name').trim(), id = fd.get('id').trim(), code = fd.get('tcode').trim().toLowerCase();
    const keep = fd.get('keep') === 'on';
    let s = Store.get('students', id);
    if (s && s.name !== name) return toast('이미 다른 이름으로 등록된 학번이에요.', 'bad');
    if (s) return enterStudent(s, keep, `${name}님, 환영해요!`);
    // 명단에 없으면 교사 코드로 입장한 학생을 미배정 상태로 등록 (모둠은 교사가 배정)
    if (!code) return toast('처음 입장할 때는 교사 코드가 필요해요.', 'bad');
    const teacher = Store.all('teachers').find(t => t.code.toLowerCase() === code);
    if (!teacher) return toast('교사 코드가 올바르지 않아요. 선생님께 다시 확인하세요.', 'bad');
    Remember.setCode(teacher.code);
    s = Store.put('students', { id, name, groupId: '', teacherCode: teacher.code });
    enterStudent(s, keep, `${teacher.name} 선생님의 학습방에 입장했어요. 모둠 배정을 기다려 주세요.`);
  },
  async loginTeacher(f, fd) {
    if (!isCode(fd.get('pw'))) return toast('교사 코드는 숫자 4자리예요.', 'bad');
    if (!(await checkPw(fd.get('pw'), Store.d.settings.pw))) return toast('교사 코드가 올바르지 않아요.', 'bad');
    const name = fd.get('name').trim();
    const { teacher, isNew } = ensureTeacher(name);
    Auth.set({ role: 'teacher', name });
    UI.modal = null; UI.next = null;
    go('#/dashboard');
    if (isNew) toast(`개인 코드 ${teacher.code}가 배정되었어요.`);
  },
  journal(f, fd) {
    const kind = f.dataset.kind, cfg = J[kind], id = f.dataset.id;
    const vals = { title: fd.get('title').trim(), date: fd.get('date'), attendees: fd.getAll('attendees') };
    cfg.fields.forEach(([k]) => vals[k] = (fd.get(k) || '').trim());
    const missing = [['title', cfg.titleLabel || '제목'], ...cfg.fields.filter(x => x[2])].find(([k]) => !vals[k]);
    if (missing) return toast(`${missing[1]}을(를) 입력하세요.`, 'bad');
    if (cfg.table) {
      const t = readTable();
      vals.resultTable = tableHasData(t) ? t : null;
      if (!vals.result && !vals.resultTable) return toast('결과 및 관찰을 글이나 표로 입력하세요.', 'bad');
    }
    if (cfg.photos) vals.photos = [...(UI.formPhotos || [])];
    let rec;
    if (id) {
      const old = Store.get(cfg.col, id);
      if (!old || !can('edit', old, cfg.col)) return toast('수정 권한이 없습니다.', 'bad');
      if (cfg.photos) PhotoDB.remove((old.photos || []).filter(p => !vals.photos.includes(p))).catch(() => { });
      const next = { ...old, ...vals };
      // 보완 요청을 받은 계획서를 고치면 다시 승인 대기로 제출
      if (kind === 'plan' && planStatus(old) === '보완 요청') next.review = { status: '대기', note: '', by: Auth.me.name, at: nowISO() };
      rec = Store.put(cfg.col, next);
    } else {
      if (!can('write')) return toast('작성 권한이 없습니다.', 'bad');
      if (LOCKED_PAGES.includes(kind) && !can('unlocked')) return toast('탐구 계획서 승인 후에 쓸 수 있어요.', 'bad');
      const me = Auth.me;
      rec = Store.put(cfg.col, { id: uid(), groupId: me.groupId, authorId: me.id, authorName: me.name, ...vals });
    }
    toast('저장했습니다.'); go(`#/${kind}/${rec.id}`);
  },
  feedback(f, fd) {
    const col = J[f.dataset.kind].col, r = Store.get(col, f.dataset.id);
    if (!r || !can('feedback')) return;
    Store.put(col, { ...r, feedback: { text: fd.get('text').trim(), by: Auth.me.name, at: nowISO() } });
    render(); toast('피드백을 저장했습니다.');
  },
  request(f, fd) {
    const vals = {
      item: fd.get('item').trim(), option: (fd.get('option') || '').trim(),
      qty: Math.max(1, parseInt(fd.get('qty'), 10) || 1), unit: fd.get('unit').trim(),
      price: Math.max(0, Math.round(Number(fd.get('price')) || 0)),
      neededBy: fd.get('neededBy'), reason: fd.get('reason').trim()
    };
    if (!vals.item) return toast('품목을 입력하세요.', 'bad');
    if (!can('unlocked')) return toast('탐구 계획서 승인 후에 신청할 수 있어요.', 'bad');
    const id = f.dataset.id;
    if (id) {
      const old = Store.get('requests', id);
      if (!old || !can('edit', old, 'requests')) return toast('이미 처리된 신청은 수정할 수 없어요.', 'bad');
      Store.put('requests', { ...old, ...vals });
      UI.editReq = null; toast('수정했습니다.');
    } else {
      if (!can('write')) return toast('신청 권한이 없습니다.', 'bad');
      const me = Auth.me;
      Store.put('requests', { id: uid(), groupId: me.groupId, authorId: me.id, authorName: me.name, ...vals });
      toast('신청했습니다.');
    }
    render();
  },
  event(f, fd) {
    if (!can('admin')) return;
    const vals = { date: fd.get('date'), endDate: fd.get('endDate') || '', title: fd.get('title').trim(), memo: fd.get('memo').trim(), groupId: fd.get('groupId') || '' };
    if (!vals.date || !vals.title) return toast('날짜와 일정을 입력하세요.', 'bad');
    if (vals.endDate && vals.endDate < vals.date) return toast('끝나는 날이 시작일보다 빨라요.', 'bad');
    if (vals.endDate === vals.date) vals.endDate = '';
    const old = f.dataset.id && Store.get('events', f.dataset.id);
    Store.put('events', old ? { ...old, ...vals } : { id: uid(), by: Auth.me.name, ...vals });
    UI.editEvent = null; UI.eventDraft = null; UI.calDay = vals.date; UI.calMonth = vals.date.slice(0, 7);
    render(); toast(old ? '일정을 수정했어요.' : '일정을 추가했어요.');
  },
  notice(f, fd) {
    if (!can('admin')) return;
    const vals = { title: fd.get('title').trim(), body: fd.get('body').trim(), pinned: fd.get('pinned') === 'on' };
    if (!vals.title) return toast('공지 제목을 입력하세요.', 'bad');
    const old = f.dataset.id && Store.get('notices', f.dataset.id);
    Store.put('notices', old ? { ...old, ...vals } : { id: uid(), by: Auth.me.name, ...vals });
    UI.editNotice = null;
    render(); toast(old ? '공지를 수정했어요.' : '공지를 올렸어요.');
  },
  settings(f, fd) {
    if (!can('admin')) return;
    Store.setSettings({ clubName: fd.get('clubName').trim(), teacherName: fd.get('teacherName').trim() });
    render(); toast('저장했습니다.');
  },
  async password(f, fd) {
    if (!can('admin')) return;
    if (!(await checkPw(fd.get('cur'), Store.d.settings.pw))) return toast('현재 비밀번호가 올바르지 않아요.', 'bad');
    if (!isCode(fd.get('pw'))) return toast('새 교사 코드는 숫자 4자리로 입력하세요.', 'bad');
    if (fd.get('pw') !== fd.get('pw2')) return toast('새 코드 확인이 일치하지 않아요.', 'bad');
    Store.setSettings({ pw: await makePw(fd.get('pw')) });
    f.reset(); toast('비밀번호를 변경했습니다. 학생 기기에도 반영하려면 다시 내보내 배포하세요.');
  },
  addGroup(f, fd) {
    if (!can('admin')) return;
    const name = fd.get('name').trim();
    if (Store.all('groups').some(g => g.name === name)) return toast('같은 이름의 모둠이 있어요.', 'bad');
    Store.put('groups', { id: uid(), name }); render(); toast(`'${name}' 모둠을 추가했습니다.`);
  },
  addStudent(f, fd) {
    if (!can('admin')) return;
    const id = fd.get('id').trim(), name = fd.get('name').trim();
    if (Store.get('students', id)) return toast('이미 등록된 학번이에요.', 'bad');
    Store.put('students', { id, name, groupId: fd.get('groupId') });
    render(); toast(`${name} 학생을 추가했습니다.`);
  },
  bulkStudents(f, fd) {
    if (!can('admin')) return;
    let n = 0;
    fd.get('text').split(/\r?\n/).forEach(line => {
      let parts = line.split(/[,\t]/).map(s => s.trim()).filter(Boolean);
      if (parts.length < 2) parts = line.trim().split(/\s+/);
      const [id, name, gname] = parts;
      if (!id || !name || id === '학번') return;
      const old = Store.get('students', id);
      const groupId = gname ? addOrFindGroup(gname).id : (old ? old.groupId : '');
      Store.put('students', { ...(old || {}), id, name, groupId });
      n++;
    });
    render(); toast(n ? `${n}명을 등록했습니다.` : '등록할 줄을 찾지 못했어요. "학번, 성명, 모둠" 형식을 확인하세요.', n ? '' : 'bad');
  }
};

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const lb = $('.lightbox');
    if (lb) return lb.remove();
    if (UI.modal && !Auth.me) Actions.closeModal();
  }
  // 결과 표 칸에서 Enter를 누르면 저장(제출) 대신 아래 칸으로 이동
  if (e.key === 'Enter' && e.target.closest && e.target.closest('#tbl-editor')) {
    e.preventDefault();
    const td = e.target.closest('td, th'), tr = td.parentNode, col = [...tr.children].indexOf(td);
    const nextRow = tr.parentNode.tagName === 'THEAD' ? $('#tbl-editor tbody tr') : tr.nextElementSibling;
    const target = nextRow && nextRow.children[col] && $('input', nextRow.children[col]);
    if (target) target.focus(); else Actions.tblAddRow();
  }
});
document.addEventListener('click', e => {
  if (e.target.classList.contains('modal-back')) return Actions.closeModal();
  const el = e.target.closest('[data-act]');
  if (el && Actions[el.dataset.act]) { e.preventDefault(); Actions[el.dataset.act](el, e); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (el && Changes[el.dataset.change]) Changes[el.dataset.change](el, e);
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-input]');
  if (el && Changes[el.dataset.input]) Changes[el.dataset.input](el, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (f && Forms[f.dataset.form]) { e.preventDefault(); Forms[f.dataset.form](f, new FormData(f)); }
});
window.addEventListener('hashchange', () => render(true));
render();
</script>
</body>
</html>
